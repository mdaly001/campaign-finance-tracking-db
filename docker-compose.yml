# Campaign Finance Disclosure DB — Docker deployment
#
#   docker compose up -d db        # start Postgres (schema auto-applied on first boot)
#   docker compose run --rm etl    # full CAL-ACCESS ETL (first time: hours, 1.5 GB download)
#   docker compose up -d mcp       # start the MCP SSE server on :9527
#
# Incremental re-check (re-downloads only if the SOS export changed):
#   docker compose run --rm etl -- incremental \
#     --database-url "postgresql://cfdb:${DB_PASSWORD}@db:5432/cfdb"
#
# Credentials are supplied via the environment (see .env.example):
#   DB_PASSWORD            superuser (cfdb) password
#   CFDB_READER_PASSWORD   read-only MCP role (cfdb_reader) password
# Both are required; there are no in-file defaults.
#
# RAM note: the ETL parses RCPT_CD (~3.8 GB TSV) in-memory. Give the etl
# container (or host) at least 8 GB of RAM; 16 GB recommended.

services:
  db:
    image: postgres:16
    container_name: cfdb-db
    environment:
      POSTGRES_USER: cfdb
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set (see .env.example)}
      POSTGRES_DB: cfdb
      TZ: America/Los_Angeles
      # Feeds the cfdb_reader role password into migration 0001 on a FRESH
      # initdb (see the DO block there). Rotate an existing cluster with
      # ALTER ROLE — see docs/credential-rotation.md.
      PGOPTIONS: -c cfdb.reader_password=${CFDB_READER_PASSWORD:?CFDB_READER_PASSWORD must be set (see .env.example)}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Apply the schema (88 tables + cfdb_reader role) on FIRST boot only.
      - ./migrations/0001_create_all_tables.sql:/docker-entrypoint-initdb.d/10-cfdb-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cfdb -d cfdb"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  mcp:
    # `image:` first so installs can pull the published image; `build:` stays
    # so local dev can `docker compose build` and run the same service from a
    # local build tagged with the same image reference.
    image: cfdb-app:${CFDB_IMAGE_TAG:-latest}
    build: .
    container_name: cfdb-mcp
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${MCP_PORT:-9527}:9527"
    environment:
      # MCP is read-only. The cfdb_reader role's password comes from
      # CFDB_READER_PASSWORD (never a literal); created by migration 0001 on
      # a fresh cluster, rotated in place otherwise.
      DATABASE_URL: "postgresql://cfdb_reader:${CFDB_READER_PASSWORD:?CFDB_READER_PASSWORD must be set}@db:5432/cfdb"
      UNREDACTED_ENABLED: "${UNREDACTED_ENABLED:-false}"
      MCP_PORT: "9527"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    restart: unless-stopped

  etl:
    image: cfdb-app:${CFDB_IMAGE_TAG:-latest}
    build: .
    container_name: cfdb-etl
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://cfdb:${DB_PASSWORD:?DB_PASSWORD must be set}@db:5432/cfdb"
      STATE_CACHE_DIR: /app/state/cache
      SOS_RAW_DATA_URL: "https://campaignfinance.cdn.sos.ca.gov/dbwebexport.zip"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    volumes:
      - statecache:/app/state/cache
    # Full load by default. Run incremental instead (see top of file).
    entrypoint: ["python", "-m", "state.etl"]
    command: ["full", "--database-url", "postgresql://cfdb:${DB_PASSWORD:?DB_PASSWORD must be set}@db:5432/cfdb"]
    restart: "no"

volumes:
  pgdata:
  statecache:
