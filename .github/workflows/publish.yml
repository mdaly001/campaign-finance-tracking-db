name: publish-image

# Builds the cfdb-app image (ETL + migrations + MCP server) and publishes it to
# GHCR. End users install by *pulling* this image — no build on their machine.
#
# Publish triggers:
#   - push to the default branch  -> ghcr.io/<owner>/cfdb-app:latest
#   - tag push (v1.2.3)           -> :1.2.3 and :1.2 tags (pinable, immutable)
#   - manual dispatch from the Actions tab
#
# NOTE for first publish: a new GHCR package under a personal account is
# created private. Set the package (or repo) to Public before telling users to
# curl the installer, or anonymous pulls will 403/401.

on:
  workflow_dispatch: {}
  push:
    branches: [master, main]
    tags: ["v*"]

jobs:
  publish:
    name: Build and publish ${{ github.repository }} image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/cfdb-app
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
